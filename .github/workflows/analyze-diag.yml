name: Analyze diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze + Test (output nel body della release diag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter analyze --no-pub > /tmp/analyze.log 2>&1
          ACODE=$?
          flutter test --reporter compact > /tmp/test.log 2>&1
          TCODE=$?
          echo "analyze=$ACODE test=$TCODE"

          ERRS=$(rg " error • " /tmp/analyze.log | head -30)
          FAILS=$(rg "^\[E\]|Some tests failed|\[E\]" /tmp/test.log | head -60)

          BODY="Diag commit ${{ github.sha }}

          analyze exit=$ACODE — test exit=$TCODE

          **Errori analyze:**
          \`\`\`
          ${ERRS:-nessuno}
          \`\`\`

          **Test falliti:**
          \`\`\`
          $(tail -c 45000 /tmp/test.log)
          \`\`\`"
          gh release delete analyze-diag --yes --cleanup-tag 2>/dev/null || true
          gh release create analyze-diag --prerelease \
            --title "Diag ${{ github.sha }}" \
            --notes "$BODY"
          if [ "$ACODE" != "0" ] || [ "$TCODE" != "0" ]; then exit 1; fi
