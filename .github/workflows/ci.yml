name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - run: flutter pub get
      # Align with upstream memex: vendored code carries info-level lints
      # (prefer_const, deprecated_member_use). Only errors/warnings gate.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
