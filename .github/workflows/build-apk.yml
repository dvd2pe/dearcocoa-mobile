name: Build APK release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/lib/**"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - "app/android/**"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # La build (SDK + pub cache + gradle + output) sfora il disco libero
      # del runner standard: si liberano ~20 GB.
      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/local/share/chromium || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      # M12: sherpa_onnx RIMOSSO (niente più build nativa CMake/NDK) — il task
      # CMake 3.22.1 non serve più. Trascrizione voce via Groq API (chiave in
      # Settings) o LLM multimodale; memo vocali sempre salvati come audio.

      # build.gradle.kts: key-global.properties si legge da rootProject (= app/android/)
      # e storeFile viene risolto rispetto alla dir del modulo :app -> percorso assoluto.
      # Keystore release dai secrets; fallback: keystore demo generato (solo test, mai store).
      - name: Keystore (release da secrets, fallback demo)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$PWD/android/app/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "Keystore release caricato dai secrets"
          else
            echo "Nessun secret keystore: genero keystore demo"
            keytool -genkeypair -v -keystore "$KS" -alias dearcocoa -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass dearcocoa2026 -keypass dearcocoa2026 \
              -dname "CN=DearCocoa, O=dvd2pe, C=IT"
            STORE_PASSWORD=dearcocoa2026
            KEY_PASSWORD=dearcocoa2026
            KEY_ALIAS=dearcocoa
          fi
          cat > android/key-global.properties <<EOF
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=$KS
          storePassword=$STORE_PASSWORD
          EOF

      - run: flutter pub get

      # SEMPRE release, mai debug (richiesta cliente).
      # push: fat APK di conferma CI. dispatch (release): split-per-abi (3 APK ~-60%).
      - name: Build APK
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            flutter build apk --release --flavor global --split-per-abi
          else
            flutter build apk --release --flavor global
          fi

      - name: Prepara artefatti
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          echo "APP_VERSION=$APP_VERSION" | tee app_version.env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mkdir -p apks
            # NB: gradle rinomina gli output con suffisso ABI e il flutter tool
            # copia anche gli APK in flutter-apk/: si prende UN file per ABI.
            for ABI in arm64-v8a armeabi-v7a x86_64; do
              f=$(find build/app/outputs -name "*$ABI*.apk" -not -path "*intermediates*" | head -1)
              [ -n "$f" ] || { echo "APK $ABI non trovato" >&2; exit 1; }
              cp "$f" "apks/dearcocoa-$APP_VERSION-$ABI.apk"
              echo "split: dearcocoa-$APP_VERSION-$ABI.apk $(du -h "$f" | cut -f1)"
            done
            N=$(ls apks/*.apk 2>/dev/null | wc -l)
            [ "$N" -eq 3 ] || { echo "attesi 3 APK per-ABI, trovati $N" >&2; ls -R build/app/outputs >&2; exit 1; }
          else
            APK=$(ls build/app/outputs/flutter-apk/*release*.apk 2>/dev/null | grep -v -E '\-arm|\-x86' | head -1)
            [ -z "$APK" ] && APK=$(find build/app/outputs -name "*.apk" -not -path "*intermediates*" | head -1)
            echo "APK trovato: $APK"
            mkdir -p apks
            cp "$APK" apks/dearcocoa-release.apk
          fi
          ls -lh apks/

      - uses: actions/upload-artifact@v4
        with:
          name: dearcocoa-release-apk
          path: app/apks/*.apk
          retention-days: 30

      # Release v<versione>-dearcocoa solo sui build dispatch (split-per-abi).
      # APK sempre release, mai debug (regola cliente).
      - name: Crea release v (da pubspec) con i 3 APK + SHA256 (solo dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APP_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          TAG="v${APP_VERSION}-dearcocoa"
          cd apks && sha256sum *.apk > SHA256SUMS-v${APP_VERSION}.txt && cd ..
          NOTES="DearCocoa v${APP_VERSION} — release automatica dalla CI.\n\n- Fix v${APP_VERSION}: note sempre in timeline anche senza AI (nuovo composer semplice), carosello suggerimenti foto rimosso, overlay/annebbiamento insights rimosso, niente più banner ed errori AI senza chiave, Groq aggiunto tra i provider LLM (chiave unica anche per la voce), Library/PARA con crea-elimina-sposta, pannello Diagnostica per community/eventi, widget umore con scala colori e legenda.\n- Firma release stabile (stesso certificato delle versioni precedenti): si aggiorna in-place senza disinstallare.\n- 3 APK per-ABI: arm64-v8a (telefoni moderni), armeabi-v7a (telefoni più vecchi), x86_64 (emulatori).\n\nInstallazione: abilitare le origini sconosciute sul dispositivo."
          gh release create "$TAG" --title "DearCocoa v${APP_VERSION} — fix UX senza AI + Groq + PARA" --notes "$NOTES" apks/*.apk \
            || gh release upload "$TAG" apks/*.apk SHA256SUMS-v${APP_VERSION}.txt --clobber
          gh release view "$TAG" --json url,assets -q '.url + " | " + ([.assets[].name] | join(", "))'
